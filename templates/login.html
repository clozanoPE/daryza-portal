{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-4">
        <div class="card border-0 shadow-lg rounded-4 p-4">
            <div class="text-center mb-4">
                <img src="/static/img/logo.png" alt="Daryza" style="height: 50px;">
                <h4 class="fw-bold mt-3 text-dark">Portal de Proveedores</h4>
                <p class="text-muted small">Ingrese su RUC y contraseña para agendar</p>
            </div>
            
            {% if form.errors %}
            <div class="alert alert-danger rounded-3 text-center small py-2 mb-3">
                <i class="bi bi-exclamation-triangle-fill me-1"></i>
                Usuario o contraseña incorrectos. Verifique e intente nuevamente.
            </div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-bold">Usuario (RUC)</label>
                    <input type="text" name="username" value="{{ form.username.value|default:'' }}" class="form-control rounded-3 {% if form.errors %}is-invalid{% endif %}" placeholder="20100193712" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Contraseña</label>
                    <input type="password" name="password" class="form-control rounded-3 {% if form.errors %}is-invalid{% endif %}" required>
                </div>
                <button type="submit" class="btn btn-success w-100 rounded-3 fw-bold py-2 shadow-sm">
                    ENTRAR AL PORTAL
                </button>
            </form>
            
            <div class="text-center mt-4">
                <a href="#" class="text-decoration-none small text-muted">¿Olvidó su contraseña? Contacte a Sistemas</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
