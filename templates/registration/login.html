{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — VBS Portal Daryza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/vbs-design-system.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-brand">
      <div class="login-logo"><span>VB</span></div>
      <div class="login-title">Portal VBS</div>
      <div class="login-sub">Daryza · Vendor Booking System</div>
    </div>
    {% if form.errors %}
    <div class="alert alert-danger" style="margin-bottom:20px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      <span>Usuario o contraseña incorrectos.</span>
    </div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-group">
        <label class="form-label required" for="id_username">Usuario</label>
        <input type="text" class="form-control" id="id_username" name="username"
          autocomplete="username" autofocus placeholder="Ingrese su usuario"
          value="{{ form.username.value|default:'' }}">
      </div>
      <div class="form-group">
        <label class="form-label required" for="id_password">Contraseña</label>
        <input type="password" class="form-control" id="id_password" name="password"
          autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
        Ingresar al Portal
      </button>
    </form>
    <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--vbs-border);text-align:center">
      <div style="font-size:11px;color:var(--vbs-text-muted)">Acceso restringido al personal autorizado.</div>
    </div>
  </div>
</div>
<script src="{% static 'js/vbs-portal.js' %}"></script>
</body>
</html>
